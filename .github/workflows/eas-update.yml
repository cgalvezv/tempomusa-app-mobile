name: EAS Build Preview (develop)

on:
  push:
    branches:
      - develop

jobs:
  build:
    name: Build APK Preview
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Instalar dependencias
        run: npm install

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build APK Preview
        id: eas_build
        run: |
          BUILD_OUTPUT=$(eas build --profile preview --platform android --non-interactive --json)
          BUILD_URL=$(echo "$BUILD_OUTPUT" | jq -r '.[0].artifacts.buildUrl')
          echo "build_url=$BUILD_URL" >> "$GITHUB_OUTPUT"

      - name: Send APK link to Telegram
        if: steps.eas_build.outputs.build_url != ''
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d parse_mode="Markdown" \
            -d text="📦 *Nueva APK disponible*%0A%0AApp: TempomusaApp%0ABranch: develop%0ACommit: ${{ github.event.head_commit.message }}%0A%0A[Descargar APK](${{ steps.eas_build.outputs.build_url }})"
